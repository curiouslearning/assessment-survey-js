version: 2.1

parameters:
  run_dryrun_test_and_publish:
    type: boolean
    default: false
  run_test_and_publish:
    type: boolean
    default: false

orbs:
  aws-s3: circleci/aws-s3@3.0
  node: circleci/node@7.0.0

commands:
  build_and_sync:
    description: Build via an npm script, then sync the build folder to an S3 destination.
    parameters:
      to:
        type: string
        description: S3 destination URI (e.g. s3://globallit-aws-s3-static-webapp-test-us-west-2).
      build-script:
        type: string
        description: npm script name defined in package.json (e.g. build).
      from:
        type: string
        default: './build'
        description: Source build folder to synchronize from.
      region:
        type: env_var_name
        default: AWS_DEFAULT_REGION
        description: Name of the env var holding the AWS region (per-environment).
    steps:
      # Assumes the calling job has already run `checkout` + `node/install-packages`.
      - run: npm run << parameters.build-script >>
      - aws-s3/sync:
          arguments: |
            --acl public-read \
            --cache-control "max-age=86400"
          aws-access-key-id: AWS_ACCESS_KEY
          aws-region: << parameters.region >>
          aws-secret-access-key: AWS_SECRET_ACCESS_KEY
          from: << parameters.from >>
          to: << parameters.to >>

jobs:
  build_and_publish:
    executor:
      name: node/default
      tag: '24.10'
    steps:
      - checkout
      - node/install-packages:
          cache-path: ~/project/node_modules
      - run: npm run build:package
      - run: mkdir -p ~/.ssh
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run: npx semantic-release@25.0.3

  build_and_publish_dryrun:
    executor:
      name: node/default
      tag: '24.10'
    steps:
      - checkout
      - node/install-packages:
          cache-path: ~/project/node_modules
      - run: npm run build:package
      - run: mkdir -p ~/.ssh
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run: npx semantic-release@25.0.3 --dry-run

  s3-deploy:
    executor:
      name: node/default
      tag: '24.10'
    steps:
      - checkout
      - node/install-packages:
          cache-path: ~/project/node_modules
      - build_and_sync:
          build-script: build
          from: ./build
          to: 's3://assessment-and-survey-development'
          region: AWS_DEFAULT_REGION

  s3-deploy-prod:
    executor:
      name: node/default
      tag: '24.10'
    steps:
      - checkout
      - node/install-packages:
          cache-path: ~/project/node_modules
      - build_and_sync:
          build-script: build
          from: ./build
          to: 's3://assessment-and-survey-production'
          region: AWS_PROD_REGION

  s3-deploy-test:
    executor:
      name: node/default
      tag: '24.10'
    steps:
      - checkout
      - node/install-packages:
          cache-path: ~/project/node_modules
      # - run: npm run lint # no lint for now, as this presents massive changes
      - run: npm test
      - build_and_sync:
          build-script: build
          from: ./build
          to: 's3://globallit-aws-s3-static-webapp-test-us-west-2/assessment-survey-js'
          region: AWS_TEST_REGION

workflows:
  s3-deploy-workflow:
    jobs:
      - node/test
      - s3-deploy:
          filters:
            branches:
              only:
                - develop
          requires:
            - node/test
      - s3-deploy-prod:
          filters:
            branches:
              only:
                - main
          requires:
            - node/test
      - s3-deploy-test:
          filters:
            branches:
              only:
                - test

  dryrun_test_and_publish:
    when: << pipeline.parameters.run_dryrun_test_and_publish >>
    # Run test + semantic-release dry-run on non-main branches to validate CI/CD safely.
    jobs:
      - node/test
      - build_and_publish_dryrun:
          context:
            - github-context
            - npmjs-context
          requires:
            - node/test

  test_and_publish:
    when: << pipeline.parameters.run_test_and_publish >>
    # Run the test jobs first, then the release only when all the test jobs are successful
    jobs:
      - node/test
      - hold_for_publish:
          type: approval
          requires:
            - node/test
          filters:
            branches:
              only:
                - main
                - rc
      - build_and_publish:
          context:
            - github-context
            - npmjs-context
          requires:
            - hold_for_publish
          filters:
            branches:
              only:
                - main
                - rc
